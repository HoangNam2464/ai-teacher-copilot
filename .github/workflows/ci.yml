name: CI — Integration Gate

# Runs on PR develop → main (full validation before release)
# and on direct push to main (safety net for hotfixes)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Spring Boot (H2 in-memory, no Postgres)
  # ──────────────────────────────────────────────
  backend:
    name: Spring Boot Test (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build and Test
        working-directory: backend
        run: ./mvnw test --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test

  # ──────────────────────────────────────────────
  # Job 2: FastAPI (requires pgvector PostgreSQL)
  # ──────────────────────────────────────────────
  ai-service:
    name: FastAPI Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aiteachercopilot_test
          POSTGRES_USER: aiteacher
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/ai-service/requirements.txt

      - name: Install dependencies
        working-directory: backend/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: backend/ai-service
        run: pytest -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          FASTAPI_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aiteachercopilot_test
          POSTGRES_USER: aiteacher
          POSTGRES_PASSWORD: ci_password
          AI_SERVICE_API_KEY: ci-test-api-key
          OPENAI_API_KEY: ''
          GEMINI_API_KEY: ''
          MINIO_ENDPOINT: 'http://localhost:9000'
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin

  # ──────────────────────────────────────────────
  # Job 3: React Frontend Build
  # ──────────────────────────────────────────────
  frontend:
    name: React Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build