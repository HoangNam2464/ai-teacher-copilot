name: AI Service CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'backend/ai-service/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'backend/ai-service/**'

jobs:
  test:
    name: FastAPI Pytest
    runs-on: ubuntu-latest

    # PostgreSQL service container — required because app.core.database.init_db()
    # connects to Postgres during FastAPI lifespan startup (triggered by ASGITransport in tests)
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aiteachercopilot_test
          POSTGRES_USER: aiteacher
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/ai-service/requirements.txt

      - name: Install dependencies
        working-directory: backend/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: backend/ai-service
        run: pytest -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          FASTAPI_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aiteachercopilot_test
          POSTGRES_USER: aiteacher
          POSTGRES_PASSWORD: ci_password
          AI_SERVICE_API_KEY: ci-test-api-key
          OPENAI_API_KEY: ''
          GEMINI_API_KEY: ''
          MINIO_ENDPOINT: 'http://localhost:9000'
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin