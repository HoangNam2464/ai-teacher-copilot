services:
  # --- PostgreSQL + pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiteachercopilot}
      POSTGRES_USER: ${POSTGRES_USER:-aiteacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiteacher} -d ${POSTGRES_DB:-aiteachercopilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- MinIO (S3-compatible file storage) ---
  minio:
    image: minio/minio:latest
    container_name: atc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme_minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- MinIO bucket initialization ---
  minio-init:
    image: minio/mc:latest
    container_name: atc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-changeme_minio_password};
      mc mb --ignore-existing local/${MINIO_BUCKET_DOCUMENTS:-documents};
      mc mb --ignore-existing local/${MINIO_BUCKET_EXPORTS:-exports};
      echo 'MinIO buckets created successfully';
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
