# ==============================================================================
# AI Teacher Copilot — PostgreSQL 16 + pgvector Tuned Configuration [OPS-006]
# ==============================================================================
# Optimized for:
# - Hardware baseline: 2GB - 4GB RAM Container / Host Environment
# - Workload: High-throughput vector similarity retrieval (pgvector HNSW)
# - Security & Stability: Controlled connection limits & memory caps
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONNECTION & NETWORKING
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100                 # Safe limit for Spring Boot HikariCP + FastAPI pools
superuser_reserved_connections = 3

# ------------------------------------------------------------------------------
# 2. MEMORY CONFIGURATION (Tuned for Vector Workloads)
# ------------------------------------------------------------------------------
# Default Postgres is conservative (128MB shared_buffers, 4MB work_mem).
# For vector retrieval, large work_mem is essential to avoid disk spill during
# vector distance sorting and HNSW index scans.

shared_buffers = 256MB                # 25% of baseline 1GB-2GB RAM (increase to 512MB for 4GB)
work_mem = 32MB                       # Prevents vector distance sort/hash from spilling to temp files on disk
maintenance_work_mem = 128MB          # Accelerates VACUUM and HNSW index creation (ef_construction=64)
effective_cache_size = 768MB          # Informs query planner of available OS file cache
temp_buffers = 16MB                   # Per-session temporary buffers

# ------------------------------------------------------------------------------
# 3. WORKER PROCESSES & PARALLEL QUERY (pgvector Tuning)
# ------------------------------------------------------------------------------
# Enables parallel workers to evaluate vector distance operators (<=>) concurrently
# across multiple CPU cores without thread starvation.

max_worker_processes = 8              # Total background and worker processes
max_parallel_workers = 4              # Max parallel workers across entire cluster
max_parallel_workers_per_gather = 2   # Up to 2 parallel workers per vector scan query
max_parallel_maintenance_workers = 2  # Accelerates parallel index builds and maintenance
parallel_leader_participation = on    # Leader process assists workers in gathering results

# ------------------------------------------------------------------------------
# 4. STORAGE & QUERY PLANNER COST HEURISTICS
# ------------------------------------------------------------------------------
# Assumes SSD / NVMe container storage environment. Low random_page_cost encourages
# planner to favor pgvector HNSW index scans over expensive sequential table scans.

random_page_cost = 1.1                # Default 4.0 is for HDD; 1.1 reflects fast SSD random access
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025            # Accounts for vector cosine distance operator computational cost
effective_io_concurrency = 200        # Enables asynchronous prefetching on SSDs
default_statistics_target = 100       # High-fidelity histogram statistics for query planner

# ------------------------------------------------------------------------------
# 5. WRITE-AHEAD LOG (WAL) & CHECKPOINTS
# ------------------------------------------------------------------------------
# Smoothes out checkpoint I/O spikes to avoid latency jitter during vector queries.

wal_level = replica
wal_buffers = 16MB                    # Smooths WAL writing during batch embedding ingest
checkpoint_completion_target = 0.9    # Spreads checkpoint writes over 90% of interval
checkpoint_timeout = 10min            # Balances recovery time with write volume
max_wal_size = 1GB
min_wal_size = 128MB

# ------------------------------------------------------------------------------
# 6. PGVECTOR SPECIFIC RUNTIME PARAMETERS
# ------------------------------------------------------------------------------
# Preload vector extension library into shared memory for zero invocation overhead.
shared_preload_libraries = 'vector'

# HNSW search exploration factor:
# ef_search controls trade-off between search speed and recall during HNSW traversal.
# Default is 40. Setting to 100 guarantees >98% recall at low retrieval latency (<50ms).
hnsw.ef_search = 100

# IVFFlat probe count (fallback if IVFFlat indexes are utilized):
# ivfflat.probes = 10

# ------------------------------------------------------------------------------
# 7. LOGGING & DIAGNOSTICS
# ------------------------------------------------------------------------------
logging_collector = off               # Docker logs collect stdout/stderr
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
log_duration = off
log_min_duration_statement = 250      # Log slow queries taking longer than 250ms
