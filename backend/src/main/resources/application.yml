# =============================================
# AI Teacher Copilot — Spring Boot Configuration
# =============================================

spring:
  application:
    name: ai-teacher-copilot

  # --- Database ---
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aiteachercopilot}
    username: ${POSTGRES_USER:aiteacher}
    password: ${POSTGRES_PASSWORD:changeme_db_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # --- JPA ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Jackson ---
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # --- Servlet Multipart (File Upload) ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

# --- Server ---
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# --- Application custom properties ---
app:
  jwt:
    secret: ${JWT_SECRET:changeme_jwt_secret_at_least_32_characters_long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:changeme_internal_api_key}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:changeme_minio_password}
    bucket-documents: ${MINIO_BUCKET_DOCUMENTS:documents}
    bucket-exports: ${MINIO_BUCKET_EXPORTS:exports}

# --- Logging ---
logging:
  level:
    com.aiteachercopilot: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
