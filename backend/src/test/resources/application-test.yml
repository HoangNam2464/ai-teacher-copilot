# Test profile — uses H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long-for-hmac
    expiration-ms: 3600000
  ai-service:
    url: http://localhost:8000
    api-key: test-api-key
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-documents: test-documents
    bucket-exports: test-exports
  frontend-url: http://localhost:3000
  mail:
    enabled: false
    from: test@school.edu.vn
    sender-name: AI Teacher Copilot
